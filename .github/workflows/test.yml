name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # Optional numeric/forecast deps are declared in pyproject.toml [project.optional-dependencies].
        # Install them explicitly here (no `pip install -e .` because pyproject has no [build-system];
        # the skill is distributed as a zip via `make package`, not as a PyPI package).
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy pandas statsmodels

      - name: Run pytest
        run: pytest -q
